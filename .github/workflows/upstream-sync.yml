name: Upstream topology audit

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      apply_main:
        description: Atomically update fork main to the audited upstream main commit
        required: true
        default: false
        type: boolean

concurrency:
  group: upstream-topology
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Resolve fork topology from GitHub
        # The topology is GitHub's own record of this repository, read at run
        # time, never a stored setting: a fork (isFork), its upstream
        # (parent), and its integration branch (default_branch).
        id: topology
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_json=$(gh api "repos/${GITHUB_REPOSITORY}")
          is_fork=$(jq -r '.fork' <<<"$repo_json")
          if [ "$is_fork" != "true" ]; then
            echo "::error::${GITHUB_REPOSITORY} is not a fork; the upstream topology audit applies only to forks" >&2
            exit 1
          fi
          upstream=$(jq -r '.parent.full_name' <<<"$repo_json")
          integration_branch=$(jq -r '.default_branch' <<<"$repo_json")
          if [ -z "$upstream" ] || [ "$upstream" = "null" ] || [ -z "$integration_branch" ] || [ "$integration_branch" = "null" ]; then
            echo "::error::GitHub returned no parent or default branch for ${GITHUB_REPOSITORY}" >&2
            exit 1
          fi
          {
            echo "upstream=$upstream"
            echo "integration_branch=$integration_branch"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch canonical upstream and fork topology
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: ${{ steps.topology.outputs.upstream }}
          FORK_INTEGRATION_BRANCH: ${{ steps.topology.outputs.integration_branch }}
        run: |
          set -euo pipefail
          git remote add canonical "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags canonical main
          git fetch --tags canonical
          git fetch --no-tags origin main "$FORK_INTEGRATION_BRANCH"

          upstream_main=$(git rev-parse canonical/main)
          fork_main=$(git rev-parse origin/main)
          latest_tag=$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq .tag_name)
          latest_release=$(git rev-parse "refs/tags/$latest_tag^{}")
          # Fork bases are upstream release tags merged into the integration
          # branch: the integration branch must contain the latest stable
          # upstream release as an ancestor, never a branch-tip commit.
          integration_base=$(git merge-base "origin/$FORK_INTEGRATION_BRANCH" "$latest_release")

          {
            echo "upstream=$UPSTREAM_REPOSITORY"
            echo "upstream_main=$upstream_main"
            echo "fork_main=$fork_main"
            echo "latest_tag=$latest_tag"
            echo "latest_release=$latest_release"
            echo "integration_branch=$FORK_INTEGRATION_BRANCH"
            echo "integration_base=$integration_base"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [[ "$integration_base" != "$latest_release" ]]; then
            echo "$FORK_INTEGRATION_BRANCH is not based on the latest stable upstream release ($latest_tag) — drift detected" >&2
            exit 1
          fi

          if [[ "$fork_main" == "$upstream_main" ]]; then
            echo "main already mirrors canonical upstream" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # De Morgan's negation of (workflow_dispatch && apply_main == true);
          # the || below is intentional, not a mistaken &&.
          # shellcheck disable=SC2055
          if [[ "${{ github.event_name }}" != workflow_dispatch || "${{ inputs.apply_main }}" != true ]]; then
            echo "main drift detected; rerun manually with apply_main=true after review" >&2
            exit 1
          fi

          git push origin "$upstream_main:refs/heads/main" \
            --force-with-lease="refs/heads/main:$fork_main"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$upstream_main"
